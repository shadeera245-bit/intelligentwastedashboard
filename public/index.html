<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Intelligent Waste Management</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">

    <h1>Intelligent Waste Management</h1>

    <p>Real-Time Monitoring Dashboard</p>

    <div class="dashboard">

      <div class="card">
        <h3>Bin Capacity</h3>
        <h2 id="capacity">0%</h2>
      </div>

      <div class="card">
        <h3>Waste Type</h3>
        <h2 id="wasteType">Unknown</h2>
      </div>

      <div class="card">
        <h3>Bin Status</h3>
        <h2 id="status">Available</h2>
      </div>

    </div>

    <div class="location">
      <h3>Location</h3>
      <p>Level 1 - Area A</p>
    </div>

  </div>

  <script src="app.js"></script>

</body>
</html>
